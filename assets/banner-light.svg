<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Fares Gdoura — Full-Stack Developer">
<title>Fares Gdoura — Full-Stack Developer</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7F7FF"/><stop offset="1" stop-color="#EEF0FF"/>
  </linearGradient>
  <radialGradient id="g1"><stop offset="0" stop-color="#7C6CFF" stop-opacity="0.18"/><stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop offset="0" stop-color="#FF4D8D" stop-opacity="0.18"/><stop offset="1" stop-color="#FF4D8D" stop-opacity="0"/></radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7C6CFF"/><stop offset="0.55" stop-color="#FF4D8D"/><stop offset="1" stop-color="#3CC4F0"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#0B1026" fill-opacity="0.07"/>
  </pattern>
  <clipPath id="frame"><rect width="1200" height="360" rx="24"/></clipPath>
</defs>
<style>
  .name { font: 800 64px "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; fill: #0B1026; letter-spacing: -1.5px; }
  .sub { font: 500 24px "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; fill: #4A5075; }
  .mono { font: 600 17px ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #5B4BE8; }
  .chip { font: 600 15px "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; fill: #2A2F52; }
  .bob { animation: bob 4s ease-in-out infinite; }
  .float { animation: float 6s ease-in-out infinite; }
  .pop { animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; transform-box: fill-box; transform-origin: center; }
  .fade { animation: fade .9s ease-out both; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  .orb1 { animation: drift 14s ease-in-out infinite alternate; }
  .orb2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
  @keyframes pop { from { opacity: 0; transform: translateY(-40px) scale(.6) } to { opacity: 1; transform: none } }
  @keyframes fade { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
  @keyframes blink { 50% { opacity: 0 } }
  @keyframes drift { from { transform: translate(0,0) } to { transform: translate(60px,30px) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
